identifier = "custom.oakapp"
app_version = "1.0.0"
assign_frontend_port = true

prepare_container = [
    { type = "RUN", command = "apt-get update" },
    { type = "RUN", command = "apt-get install -y python3 python3-pip wget git" },
]

prepare_build_container = [
    { type = "RUN", command = "bash -c 'curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash && . \"$HOME/.nvm/nvm.sh\" && nvm install 24'" },
]

build_steps = ["pip3 install -r /app/requirements.txt --break-system-packages"]

entrypoint = ["/entrypoint.sh", "python3", "-u", "/app/main.py"]

[static_frontend]
dist_path = "./frontend/dist"

[static_frontend.build]
source_path = "./frontend"
steps = [
    "bash -c 'cd /app/frontend && . $HOME/.nvm/nvm.sh && npm ci && npm run build'",
]

[env]
WEBRTC__DC_MESSAGE__ORDERED = "false"
WEBRTC__DC_MESSAGE__MAX_RETRANSMITS = "0"
WEBRTC__DC_MESSAGE__QUEUE_POLICY = "lossy_drop_new"
WEBRTC__DC_MESSAGE__LOSSY_MEDIA_MAX_BUFFERED_AMOUNT = "8388608"

[base_image]
api_url = "https://registry-1.docker.io"
service = "registry.docker.io"
oauth_url = "https://auth.docker.io/token"
auth_type = "repository"
auth_name = "luxonis/oakapp-base"
image_name = "luxonis/oakapp-base"
image_tag = "1.3.0"